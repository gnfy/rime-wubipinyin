# weasel.custom.yaml —— Windows（小狼毫 Weasel）界面配置
#
# 颜色写法：本文件所有配色显式声明 color_format: abgr，即 `0xAABBGGRR`
#   （BGR 倒序，与 macOS 的 squirrel.custom.yaml 一致，方便两边对照）。
#   例：网页色 #D1635D（R=D1 G=63 B=5D）写成 0x5D63D1。首字节透明度可省略。
#
# 字体：Consolas 随 Windows 自带，等宽，用于序号和五笔编码注释。
#   候选词用 Microsoft YaHei（微软雅黑）。

patch:
  show_notifications_time: 200            # 部署/中英切换提示的显示时长 ms

  style:
    color_scheme: roseo_maple               # 浅色
    color_scheme_dark: roseo_maple_dark     # 深色（Weasel 0.15+ 跟随系统）

    inline_preedit: true                    # 编码直接写进输入框
    preedit_type: composition               # composition | preview | preview_all
    display_tray_icon: false
    text_orientation: horizontal

    # 候选带五笔编码注释时竖排更易读；想横排改 horizontal: true 且 layout/type: horizontal
    horizontal: false
    layout:
      type: vertical                        # vertical | horizontal | vertical_text | vertical+fullscreen
      align_type: center                    # 序号、候选词、注释纵向对齐
      corner_radius: 5
      round_corner: 5                       # 选中项圆角
      border_width: 1
      margin_x: 10
      margin_y: 6
      spacing: 8                            # 编码与候选之间（inline_preedit: false 时）
      candidate_spacing: 6                  # 候选之间
      hilite_spacing: 6                     # 序号与候选词之间
      hilite_padding: 4                     # 选中项内边距
      shadow_radius: 6
      shadow_offset_x: 0
      shadow_offset_y: 2

    # 字号：序号和注释都比候选词小一号，视觉重心在候选词上
    font_face: "Microsoft YaHei"
    font_point: 13
    label_font_face: "Consolas"             # 等宽！否则数字宽度不一，候选词会左右跳动
    label_font_point: 11
    comment_font_face: "Consolas"           # 五笔编码是字母，等宽更好读
    comment_font_point: 11

  preset_color_schemes:
    # ---------------- 浅色 ----------------
    roseo_maple:
      name: 玫枫 / Roseo Maple
      author: KyleBing
      color_format: abgr

      back_color: 0xF4F4F6                       # 面板背景
      border_color: 0xE0E0E0
      shadow_color: 0x30000000
      text_color: 0x8E8E93                       # 编码区文字（inline_preedit: false 时）
      hilited_text_color: 0x4F11FA
      hilited_back_color: 0xEFEFF4

      candidate_text_color: 0x222222             # 候选词
      label_color: 0xAAAAAA                      # 序号
      comment_text_color: 0x5AC461               # 注释（五笔编码提示）

      # 选中项必须有实底色。上游 MacRoseo 用的是 0x004F11FA（首字节 00 全透明），
      # 只靠字色区分，对比度过低，快速打字容易选错。
      hilited_candidate_back_color: 0xEDEDF9
      hilited_candidate_text_color: 0x4F11FA
      hilited_label_color: 0x4F11FA
      hilited_comment_text_color: 0x4FA85A
      hilited_candidate_border_color: 0x00000000
      hilited_candidate_shadow_color: 0x00000000

      prevpage_color: 0xAAAAAA
      nextpage_color: 0xAAAAAA

    # ---------------- 深色 ----------------
    roseo_maple_dark:
      name: 玫枫-暗黑 / Roseo Maple Dark
      author: KyleBing
      color_format: abgr

      back_color: 0x2B2B2B
      border_color: 0x3F3F3F
      shadow_color: 0x80000000
      text_color: 0x8E8E93
      hilited_text_color: 0xFFFFFF
      hilited_back_color: 0x3A3A3A

      candidate_text_color: 0xDCDCDC
      label_color: 0x8A8A8A
      comment_text_color: 0x5AC461

      hilited_candidate_back_color: 0x3C1E7A     # 深玫红实底，与 macOS 深色一致
      hilited_candidate_text_color: 0xFFFFFF
      hilited_label_color: 0xE0E0E0
      hilited_comment_text_color: 0xC8E8CC
      hilited_candidate_border_color: 0x00000000
      hilited_candidate_shadow_color: 0x00000000

      prevpage_color: 0x8A8A8A
      nextpage_color: 0x8A8A8A

    # ---------------- 备选：玫红实底（上游 MacRoseoAlt）----------------
    roseo_maple_solid:
      name: 玫枫-实底 / Roseo Maple Solid
      author: KyleBing
      color_format: abgr
      back_color: 0xFFFFFF
      border_color: 0xD6D6D6
      text_color: 0x000000
      hilited_text_color: 0x000000
      hilited_back_color: 0xFFFFFF
      candidate_text_color: 0x000000
      label_color: 0x999999
      comment_text_color: 0x5AC461
      hilited_candidate_text_color: 0xFFFFFF
      hilited_candidate_back_color: 0x4F11FA
      hilited_label_color: 0xFFFFFF
      hilited_comment_text_color: 0xFFFFFF

  # ---------------------------------------------------------------
  # 指定程序默认英文输入（进程名，不区分大小写）
  # ---------------------------------------------------------------
  app_options:
    windowsterminal.exe:  { ascii_mode: true }
    cmd.exe:              { ascii_mode: true }
    powershell.exe:       { ascii_mode: true }
    pwsh.exe:             { ascii_mode: true }
    code.exe:             { ascii_mode: true }   # VS Code
#    idea64.exe:           { ascii_mode: true }   # IntelliJ IDEA
